name: ios unsigned ipa build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: show xcode version
        run: xcodebuild -version

      - name: build unsigned iphone app
        run: |
          xcodebuild \
            -project VibeToApp.xcodeproj \
            -scheme VibeToApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: package unsigned ipa
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/VibeToApp.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          mkdir -p ipa/Payload
          ditto "$APP_PATH" "ipa/Payload/VibeToApp.app"
          (
            cd ipa
            ditto -c -k --sequesterRsrc --keepParent Payload ../VibeToApp-unsigned.ipa
          )
          test -s VibeToApp-unsigned.ipa
          echo "Created unsigned IPA:"
          ls -lh VibeToApp-unsigned.ipa

      - name: upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: VibeToApp-unsigned-IPA
          path: VibeToApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
