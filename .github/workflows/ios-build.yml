name: ios simulator build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: select xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: build simulator app
        run: |
          xcodebuild \
            -project VibeToApp.xcodeproj \
            -scheme VibeToApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: package simulator app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/VibeToApp.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" VibeToApp-Simulator.zip

      - name: upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: VibeToApp-iOS-Simulator
          path: VibeToApp-Simulator.zip
          if-no-files-found: error
          retention-days: 7
