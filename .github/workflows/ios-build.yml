name: ios simulator build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: select xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: build simulator app
        run: |
          xcodebuild \
            -project VibeToApp.xcodeproj \
            -scheme VibeToApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: boot an available iphone simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          echo "SIMULATOR_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: install and launch app in simulator
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/VibeToApp.app"
          test -d "$APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_UDID" com.chayce22315.vibetoapprefreshed
          mkdir -p test-output
          xcrun simctl io "$SIMULATOR_UDID" screenshot test-output/iphone-simulator.png
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 2m --style compact > test-output/simulator.log || true

      - name: upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: VibeToApp-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/VibeToApp.app
          if-no-files-found: error
          retention-days: 7

      - name: upload simulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VibeToApp-Simulator-Test-Evidence
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7
